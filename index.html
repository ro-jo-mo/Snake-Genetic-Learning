<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <h1>Snake</h1>

  <div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>High Score: <span id="high-score">0</span></span>
  </div>

  <div id="game-row">
    <div id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="spectate-panel">
      <table id="spectate-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Score</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="spectate-tbody"></tbody>
      </table>
    </div>
  </div>
  <p id="controls">
    <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> &nbsp;to move &nbsp;|&nbsp;
    <kbd>Space</kbd> to pause
  </p>

    <p id="message"></p>
  <div id="ai-settings">
    <div class="ai-setting">
      <label for="ai-population">Population</label>
      <input type="number" id="ai-population" value="50" min="1">
    </div>
    <div class="ai-setting">
      <label for="ai-keep-top-k">Keep Top K</label>
      <input type="number" id="ai-keep-top-k" value="10" min="1">
    </div>
    <div class="ai-setting">
      <label for="ai-perturb-freq">Perturbation Frequency</label>
      <input type="number" id="ai-perturb-freq" value="0.1" min="0" max="1" step="0.01">
    </div>
    <div class="ai-setting">
      <label for="ai-perturb-mag">Perturbation Magnitude</label>
      <input type="number" id="ai-perturb-mag" value="0.5" min="0" step="0.01">
    </div>
    <div class="ai-setting" id="layer-sizes-row">
      <label>Layer Sizes</label>
      <div id="layer-inputs">
        <input type="number" class="layer-input" value="32" min="1">
      </div>
      <button id="layer-add">+</button>
      <button id="layer-remove">-</button>
    </div>
    <button id="train-button">Train</button>
  </div>





  <script type="module" src="/src/main.ts"></script>
</body>
</html>
